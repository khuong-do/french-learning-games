<script>
try {
  document.documentElement.lang = localStorage.getItem('delfA2Language') === 'en' ? 'en' : 'vi';
} catch (error) {
  console.warn('Unable to read the saved DELF A2 language preference.', error);
  document.documentElement.lang = 'vi';
}
</script>

  <span class="brand">🌍 LEARN &amp; PLAY</span>
  <button class="language-toggle" id="languageToggle" type="button" aria-label="Switch language to English">English</button>
</header>
<main>
  <section class="hero" aria-labelledby="pageTitle">
    <p class="eyebrow" id="eyebrow">DELF A2 · CHIẾN DỊCH ĐỌC VÀ VIẾT</p>

  </section>
  <section class="game-status" id="gameStatus" aria-label="Tiến độ trò chơi">
    <div class="status-row"><span id="stage">Mở đầu</span><strong id="score">⭐ Điểm: 0 / 50</strong></div>
    <div class="progress-track" id="progressTrack" role="progressbar" aria-label="Tiến độ nhiệm vụ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </section>
  <section class="game-panel" id="game" aria-live="polite" aria-atomic="false"></section>
  <p class="sr-only" id="languageAnnouncement" aria-live="polite"></p>
